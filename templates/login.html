<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Kelurahan Cimanuk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           DESIGN TOKENS (matched to public site)
        ========================================================= */
        :root {
            --navy: #1E3A5F;
            --navy-dark: #14283F;
            --navy-soft: #2C4A73;
            --accent: #4A7FC9;
            --accent-soft: #EAF2FC;
            --danger: #E15554;
            --border: #E5E7EB;
            --text: #1F2937;
            --text-muted: #64748B;
            --radius-lg: 20px;
            --shadow-lg: 0 25px 60px rgba(10, 22, 40, 0.35);
            --transition: 0.3s cubic-bezier(.4,0,.2,1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 55%, var(--navy-soft) 100%);
        }

        /* Ambient background motif — soft radial glow + faint contour rings */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        body::before {
            width: 620px; height: 620px;
            background: radial-gradient(circle, rgba(74,127,201,0.35) 0%, transparent 70%);
            top: -220px; right: -180px;
        }
        body::after {
            width: 520px; height: 520px;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
            bottom: -200px; left: -160px;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            animation: cardRise .7s cubic-bezier(.4,0,.2,1) both;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }

        @keyframes cardRise {
            from { opacity: 0; transform: translateY(24px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 22px;
        }
        .login-logo .badge-icon {
            width: 66px; height: 66px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 14px;
            backdrop-filter: blur(6px);
        }
        .login-logo h6 {
            color: rgba(255,255,255,0.65);
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-size: .72rem;
            margin: 0;
        }
        .login-logo h5 {
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
            margin: 2px 0 0;
        }

        .login-card {
            width: 100%;
            padding: 40px 36px 34px;
            background: rgba(255,255,255,0.97);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(14px);
        }

        .login-card h3 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--navy-dark);
            text-align: center;
            margin-bottom: 6px;
        }
        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: .88rem;
            margin-bottom: 28px;
        }

        .alert-danger {
            border-radius: 12px;
            border: 1px solid #F3C6C6;
            background: #FDECEC;
            color: #B23A3A;
            font-size: .88rem;
            padding: 12px 16px;
        }

        .form-group-icon { position: relative; margin-bottom: 18px; }
        .form-group-icon label {
            display: block;
            font-size: .82rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 7px;
        }
        .form-group-icon .icon-wrap {
            position: relative;
        }
        .form-group-icon i.field-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: .95rem;
            transition: var(--transition);
        }
        .form-group-icon input.form-control {
            padding: 12px 16px 12px 44px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: .95rem;
            transition: var(--transition);
        }
        .form-group-icon input.form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        .form-group-icon input.form-control:focus ~ i.field-icon,
        .icon-wrap:focus-within i.field-icon {
            color: var(--accent);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: .9rem;
        }
        .toggle-password:hover { color: var(--navy); }

        .btn-login {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 600;
            font-size: .98rem;
            color: #fff;
            background: linear-gradient(135deg, var(--navy) 0%, var(--accent) 100%);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            margin-top: 6px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(30,58,95,0.28); }
        .btn-login:active { transform: translateY(0); }
        .btn-login .spinner-border {
            width: 1rem; height: 1rem;
            display: none;
            margin-right: 8px;
            vertical-align: -2px;
        }
        .btn-login.is-loading .spinner-border { display: inline-block; }
        .btn-login.is-loading .btn-login-label::after { content: 'Memproses...'; }
        .btn-login.is-loading .btn-login-label { visibility: hidden; position: relative; }
        .btn-login.is-loading .btn-login-label::after {
            visibility: visible;
            position: absolute;
            left: 0; right: 0;
        }

        .login-footer-note {
            text-align: center;
            margin-top: 22px;
            font-size: .78rem;
            color: rgba(255,255,255,0.55);
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px 28px; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-logo">
            <div class="badge-icon"><i class="fa-solid fa-landmark"></i></div>
            <h6>Sistem Administrasi</h6>
            <h5>Kelurahan Cimanuk</h5>
        </div>

        <div class="login-card">
            <h3>Login Administrator</h3>
            <p class="login-subtitle">Masuk untuk mengelola konten website</p>

            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" id="login-form">
                <div class="form-group-icon">
                    <label for="username">Username</label>
                    <div class="icon-wrap">
                        <i class="fa-solid fa-user field-icon"></i>
                        <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group-icon">
                    <label for="password">Password</label>
                    <div class="icon-wrap">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-label="Tampilkan password" onclick="togglePasswordVisibility()">
                            <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login" id="login-submit-btn">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    <span class="btn-login-label">Login</span>
                </button>
            </form>
        </div>

        <p class="login-footer-note">&copy; Kelurahan Cimanuk &mdash; Akses Terbatas untuk Petugas Resmi</p>
    </div>

    <script>
        // Show/hide password
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggle-password-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Loading state on submit (visual only — form still submits normally to Flask)
        document.getElementById('login-form').addEventListener('submit', function () {
            document.getElementById('login-submit-btn').classList.add('is-loading');
        });
    </script>
</body>
</html>
